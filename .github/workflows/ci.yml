name: "IgnisCore CI / Test Suite"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-configs:
    name: "Validate Configuration Files"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON configuration files
        run: |
          python3 -c "
          import json, glob, sys
          config_files = glob.glob('configs/*.json')
          if not config_files:
              print('No config files found!')
              sys.exit(1)
          for f in sorted(config_files):
              try:
                  with open(f, 'r') as fp:
                      json.load(fp)
                  print(f'✓ Validated: {f}')
              except Exception as err:
                  print(f'✗ Failed to parse {f}: {err}', file=sys.stderr)
                  sys.exit(1)
          print(f'\nSuccessfully verified {len(config_files)} configuration files.')
          "

  backend-test:
    name: "Backend Tests (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend unit & integration tests
        working-directory: backend
        run: npm test

  frontend-test:
    name: "Frontend Tests & Build (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test

      - name: Run Production bundle build
        working-directory: frontend
        run: npm run build

  ml-service-test:
    name: "ML Service Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML service test suite
        working-directory: ml-service
        run: python -m unittest test_ml_service.py

  docker-compose-validate:
    name: "Docker & Container Validation"
    runs-on: ubuntu-latest
    needs: [validate-configs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose specification
        run: docker compose config

      - name: Build Backend Docker image
        run: docker build -t igniscore-backend:ci ./backend

      - name: Build ML Service Docker image
        run: docker build -t igniscore-ml:ci ./ml-service
