<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bldgBgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <pattern id="cadGridC" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <linearGradient id="kitchenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="officeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#115E59" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="corridorGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="exitGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="exitGlowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="680" height="480" fill="url(#bldgBgC)" rx="12"/>
  <rect width="680" height="480" fill="url(#cadGridC)" rx="12"/>

  <!-- Building Header -->
  <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
    BUILDING C — OPERATIONS &amp; LOGISTICS CENTER (BLDG-C)
  </text>
  <text x="475" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
    South Logistics Sector • 2,800 m²
  </text>

  <!-- Exterior Building Envelope Perimeter -->
  <rect x="40" y="42" width="560" height="370" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="6 3" rx="4"/>

  <!-- ZONE 1: Commercial Kitchen (x:50, y:50, w:170, h:110) -->
  <g id="zone_bldg_c_kitchen">
    <rect x="50" y="50" width="170" height="110" fill="url(#kitchenGrad)" stroke="#EF4444" stroke-width="2" rx="4"/>
    <text x="62" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FCA5A5">COMMERCIAL KITCHEN</text>
    <text x="62" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_c_kitchen • Grease/Burner</text>
    <rect x="62" y="105" width="70" height="18" rx="9" fill="#B91C1C"/>
    <text x="70" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FEE2E2">FLAM: 4.7 / 5</text>
    <circle cx="195" cy="70" r="7" fill="#EF4444"/>
    <text x="190" y="73" font-size="9" fill="#FFF">🔥</text>
  </g>

  <!-- ZONE 2: Administrative Offices (x:240, y:50, w:350, h:110) -->
  <g id="zone_bldg_c_office">
    <rect x="240" y="50" width="350" height="110" fill="url(#officeGrad)" stroke="#14B8A6" stroke-width="2" rx="4"/>
    <text x="252" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#99F6E4">ADMINISTRATIVE OFFICES</text>
    <text x="252" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_c_office • Open Workstation Floor • Max Occupancy: 45</text>
    <rect x="252" y="105" width="70" height="18" rx="9" fill="#0F766E"/>
    <text x="260" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#CCFBF1">FLAM: 2.5 / 5</text>
    <circle cx="560" cy="70" r="7" fill="#14B8A6"/>
    <text x="556" y="73" font-size="9" fill="#FFF">💼</text>
  </g>

  <!-- ZONE 3: Central Service Hall (x:50, y:180, w:540, h:80) -->
  <g id="zone_bldg_c_corridor">
    <rect x="50" y="180" width="540" height="80" fill="url(#corridorGradC)" stroke="#64748B" stroke-width="2" rx="4"/>
    <text x="230" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">CENTRAL SERVICE HALLWAY</text>
    <text x="245" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">ID: bldg_c_corridor • Logistics Pathway • Flam: 1.9</text>
    <path d="M 120 220 L 80 220 M 90 215 L 80 220 L 90 225" stroke="#10B981" stroke-width="2.5" fill="none"/>
    <path d="M 520 220 L 560 220 M 550 215 L 560 220 L 550 225" stroke="#10B981" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ZONE 4: Dry Goods & Supply Storage (x:50, y:280, w:170, h:120) -->
  <g id="zone_bldg_c_storage">
    <rect x="50" y="280" width="170" height="120" fill="url(#kitchenGrad)" stroke="#F59E0B" stroke-width="2" rx="4"/>
    <text x="62" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">DRY GOODS STORAGE</text>
    <text x="62" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_c_storage • Palletized</text>
    <rect x="62" y="338" width="70" height="18" rx="9" fill="#B45309"/>
    <text x="70" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FEF3C7">FLAM: 4.3 / 5</text>
  </g>

  <!-- ZONE 5: Exit A Loading Bay Exit (x:240, y:280, w:160, h:120) -->
  <g id="zone_bldg_c_exit_a">
    <rect x="240" y="280" width="160" height="120" fill="url(#exitGradC)" stroke="#10B981" stroke-width="3" rx="4" filter="url(#exitGlowC)"/>
    <text x="255" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#A7F3D0">EXIT A (LOADING BAY)</text>
    <text x="255" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6EE7B7">Industrial Roller Gate Exit</text>
    <text x="255" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Capacity: 120 Occupants</text>
    <rect x="255" y="365" width="80" height="20" rx="4" fill="#047857"/>
    <text x="267" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ECFDF5">SAFE EXIT</text>
  </g>

  <!-- ZONE 6: Exit B Staff Entrance (x:420, y:280, w:170, h:120) -->
  <g id="zone_bldg_c_exit_b">
    <rect x="420" y="280" width="170" height="120" fill="url(#exitGradC)" stroke="#10B981" stroke-width="3" rx="4" filter="url(#exitGlowC)"/>
    <text x="435" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#A7F3D0">EXIT B (STAFF GATE)</text>
    <text x="435" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6EE7B7">Pedestrian Turnstile Egress</text>
    <text x="435" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Capacity: 120 Occupants</text>
    <rect x="435" y="365" width="80" height="20" rx="4" fill="#047857"/>
    <text x="447" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ECFDF5">SAFE EXIT</text>
  </g>

  <!-- Door Connectors -->
  <rect x="130" y="160" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="380" y="160" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="130" y="260" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="310" y="260" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="500" y="260" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>

  <!-- Legend Bar -->
  <g transform="translate(50, 435)">
    <rect x="0" y="0" width="12" height="12" fill="#EF4444" rx="2"/>
    <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Commercial Kitchen (High Fire)</text>

    <rect x="200" y="0" width="12" height="12" fill="#14B8A6" rx="2"/>
    <text x="218" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Offices &amp; Workstations</text>

    <rect x="370" y="0" width="12" height="12" fill="#F59E0B" rx="2"/>
    <text x="388" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Dry Goods Supply</text>

    <rect x="510" y="0" width="12" height="12" fill="#10B981" rx="2"/>
    <text x="528" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Loading / Exit Bay</text>
  </g>
</svg>
