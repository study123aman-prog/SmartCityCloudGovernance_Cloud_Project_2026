<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="routeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Blocked Naive Path Marker -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>

    <!-- Safe Dijkstra Dynamic Path Marker -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="url(#routeBg)" rx="16"/>

  <!-- Title -->
  <text x="40" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">
    DYNAMIC HAZARD-WEIGHTED DIJKSTRA EVACUATION ROUTER
  </text>
  <text x="40" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">
    Cost Function: EdgeCost(u, v) = Distance(u, v) · [1.0 + β · (HazardScore_v / 100)²]
  </text>

  <!-- Left: Conventional / Naive Egress (Vulnerable) -->
  <g transform="translate(40, 95)">
    <rect width="400" height="320" fill="#111827" stroke="#334155" stroke-width="1.5" rx="8"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#EF4444">
      CONVENTIONAL STATIC EXIT (Naive Path)
    </text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">
      Static exit signage routes occupants through shortest distance.
    </text>

    <!-- Origin Node -->
    <circle cx="60" cy="120" r="24" fill="#3B82F6"/>
    <text x="46" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFF">LAB 1</text>

    <!-- Compromised Node -->
    <rect x="160" y="80" width="90" height="80" fill="#7F1D1D" stroke="#EF4444" stroke-width="2" rx="6"/>
    <text x="175" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FCA5A5">FIRE ZONE</text>
    <text x="182" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FEE2E2">Score: 92%</text>

    <!-- Destination Exit -->
    <circle cx="340" cy="120" r="26" fill="#047857" stroke="#10B981" stroke-width="2"/>
    <text x="322" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFF">EXIT A</text>

    <!-- Naive Traversal Line Directly Into Fire -->
    <line x1="84" y1="120" x2="155" y2="120" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
    <line x1="250" y1="120" x2="310" y2="120" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 3" opacity="0.3"/>

    <!-- Failure Callout Box -->
    <rect x="20" y="210" width="360" height="85" fill="#1E293B" stroke="#991B1B" stroke-width="1" rx="6"/>
    <text x="35" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FCA5A5">
      ⚠️ CRITICAL CASUALTY RISK
    </text>
    <text x="35" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#CBD5E1">
      Occupants proceed blindly into smoke-compromised zone.
    </text>
    <text x="35" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">
      Zero real-time hazard awareness or rerouting capability.
    </text>
  </g>

  <!-- Right: IgnisCore Dynamic Dijkstra Router (Adaptive) -->
  <g transform="translate(480, 95)">
    <rect width="400" height="320" fill="#111827" stroke="#10B981" stroke-width="1.5" rx="8"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#10B981">
      IGNISCORE ADAPTIVE EGRESS (Dynamic Dijkstra)
    </text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">
      Graph edges penalty-weighted by live risk; dynamically bypasses danger.
    </text>

    <!-- Origin Node -->
    <circle cx="60" cy="120" r="24" fill="#3B82F6"/>
    <text x="46" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFF">LAB 1</text>

    <!-- Compromised Node (Blocked) -->
    <rect x="160" y="80" width="90" height="80" fill="#450A0A" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="3 3" rx="6" opacity="0.6"/>
    <text x="175" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EF4444">BLOCKED</text>
    <text x="178" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#991B1B">Cost: +∞</text>

    <!-- Safe Intermediate Node (Corridor South) -->
    <circle cx="180" cy="220" r="22" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
    <text x="160" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#E0F2FE">OPTICS</text>

    <!-- Destination Safe Exit B -->
    <circle cx="340" cy="220" r="26" fill="#047857" stroke="#10B981" stroke-width="2"/>
    <text x="322" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFF">EXIT B</text>

    <!-- Rerouted Safe Egress Pathway -->
    <path d="M 75 140 Q 110 200 155 220" fill="none" stroke="#10B981" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
    <path d="M 205 220 L 310 220" fill="none" stroke="#10B981" stroke-width="3.5" marker-end="url(#arrowGreen)"/>

    <!-- Success Callout Box -->
    <rect x="20" y="260" width="360" height="45" fill="#1E293B" stroke="#047857" stroke-width="1" rx="6"/>
    <text x="35" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399">
      ✓ ZERO FIRE EXPOSURE PATH COMPUTED
    </text>
    <text x="35" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">
      Safest egress latency: &lt;15ms • Live rerouting broadcast to UI &amp; SMS.
    </text>
  </g>
</svg>
