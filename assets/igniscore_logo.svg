<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Tech Circuit Stroke Gradient -->
    <linearGradient id="techStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle / Plate -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)" stroke="#334155" stroke-width="4"/>

  <!-- Orbital Sensor Nodes Ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="250" cy="50" r="6" fill="#38BDF8"/>
  <circle cx="250" cy="450" r="6" fill="#38BDF8"/>
  <circle cx="50" cy="250" r="6" fill="#38BDF8"/>
  <circle cx="450" cy="250" r="6" fill="#38BDF8"/>

  <!-- Shield Base Contour -->
  <path d="M 250 80 
           C 340 80, 390 110, 390 190 
           C 390 310, 290 380, 250 410 
           C 210 380, 110 310, 110 190 
           C 110 110, 160 80, 250 80 Z" 
        fill="#111827" 
        stroke="url(#shieldGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"/>

  <!-- Inner Circuit Grid lines -->
  <path d="M 160 210 L 210 210 L 230 180" fill="none" stroke="url(#techStroke)" stroke-width="3"/>
  <circle cx="160" cy="210" r="4" fill="#38BDF8"/>
  <path d="M 340 210 L 290 210 L 270 180" fill="none" stroke="url(#techStroke)" stroke-width="3"/>
  <circle cx="340" cy="210" r="4" fill="#38BDF8"/>
  <path d="M 210 320 L 250 350 L 290 320" fill="none" stroke="url(#techStroke)" stroke-width="2.5"/>

  <!-- Outer Flame Body -->
  <path d="M 250 360
           C 210 340, 170 300, 170 240
           C 170 190, 200 160, 220 140
           C 225 170, 240 185, 255 175
           C 270 165, 275 145, 270 120
           C 305 155, 330 200, 330 250
           C 330 300, 295 340, 250 360 Z"
        fill="url(#flameGrad)"
        filter="url(#flameGlow)"/>

  <!-- Inner Flame Heart -->
  <path d="M 250 340
           C 225 325, 200 295, 200 255
           C 200 225, 220 200, 235 185
           C 240 205, 250 215, 260 210
           C 270 200, 275 190, 275 175
           C 295 200, 300 230, 300 260
           C 300 295, 275 325, 250 340 Z"
        fill="url(#coreGrad)"/>

  <!-- Center Ignition Spark -->
  <ellipse cx="250" cy="275" rx="15" ry="30" fill="#FFFFFF" opacity="0.95"/>
</svg>
