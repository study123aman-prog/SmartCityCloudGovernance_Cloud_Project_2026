<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bldgBgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <pattern id="cadGridB" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="classGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="corridorGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="exitGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="exitGlowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="680" height="480" fill="url(#bldgBgB)" rx="12"/>
  <rect width="680" height="480" fill="url(#cadGridB)" rx="12"/>

  <!-- Building Header -->
  <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
    BUILDING B — ACADEMIC &amp; COMPUTE COMPLEX (BLDG-B)
  </text>
  <text x="480" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
    East Academic Sector • 4,500 m²
  </text>

  <!-- Exterior Building Envelope Perimeter -->
  <rect x="40" y="42" width="560" height="370" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="6 3" rx="4"/>

  <!-- ZONE 1: High-Density Server Room (x:50, y:50, w:160, h:110) -->
  <g id="zone_bldg_b_server">
    <rect x="50" y="50" width="160" height="110" fill="url(#serverGrad)" stroke="#EA580C" stroke-width="2" rx="4"/>
    <text x="62" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FDBA74">SERVER ROOM (HPC)</text>
    <text x="62" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_b_server • Thermal Load</text>
    <rect x="62" y="105" width="70" height="18" rx="9" fill="#9A3412"/>
    <text x="70" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFEDD5">FLAM: 4.6 / 5</text>
    <circle cx="185" cy="70" r="7" fill="#EA580C"/>
    <text x="180" y="73" font-size="9" fill="#FFF">🖥️</text>
  </g>

  <!-- ZONE 2: Classroom 1 Auditorium (x:230, y:50, w:170, h:110) -->
  <g id="zone_bldg_b_class1">
    <rect x="230" y="50" width="170" height="110" fill="url(#classGrad)" stroke="#6366F1" stroke-width="2" rx="4"/>
    <text x="242" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#C7D2FE">CLASSROOM 1 (AUDITORIUM)</text>
    <text x="242" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_b_class1 • Max: 90</text>
    <rect x="242" y="105" width="70" height="18" rx="9" fill="#4338CA"/>
    <text x="250" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#EEF2FF">FLAM: 2.2 / 5</text>
    <circle cx="380" cy="70" r="7" fill="#6366F1"/>
    <text x="376" y="73" font-size="9" fill="#FFF">👥</text>
  </g>

  <!-- ZONE 3: Classroom 2 Lecture Hall (x:420, y:50, w:170, h:110) -->
  <g id="zone_bldg_b_class2">
    <rect x="420" y="50" width="170" height="110" fill="url(#classGrad)" stroke="#818CF8" stroke-width="2" rx="4"/>
    <text x="432" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E0E7FF">CLASSROOM 2 (HALL)</text>
    <text x="432" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_b_class2 • Max: 70</text>
    <rect x="432" y="105" width="70" height="18" rx="9" fill="#4338CA"/>
    <text x="440" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#EEF2FF">FLAM: 2.2 / 5</text>
    <circle cx="570" cy="70" r="7" fill="#818CF8"/>
    <text x="566" y="73" font-size="9" fill="#FFF">👥</text>
  </g>

  <!-- ZONE 4: Main Promenade Corridor (x:50, y:180, w:540, h:80) -->
  <g id="zone_bldg_b_corridor">
    <rect x="50" y="180" width="540" height="80" fill="url(#corridorGradB)" stroke="#64748B" stroke-width="2" rx="4"/>
    <text x="210" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">MAIN PROMENADE CORRIDOR</text>
    <text x="235" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">ID: bldg_b_corridor • High Occupancy Flow • Flam: 1.5</text>
    <path d="M 120 220 L 80 220 M 90 215 L 80 220 L 90 225" stroke="#10B981" stroke-width="2.5" fill="none"/>
    <path d="M 520 220 L 560 220 M 550 215 L 560 220 L 550 225" stroke="#10B981" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ZONE 5: Facilities & Archive Storage (x:50, y:280, w:160, h:120) -->
  <g id="zone_bldg_b_storage">
    <rect x="50" y="280" width="160" height="120" fill="url(#serverGrad)" stroke="#D97706" stroke-width="2" rx="4"/>
    <text x="62" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">FACILITIES ARCHIVE</text>
    <text x="62" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">ID: bldg_b_storage • Combustible</text>
    <rect x="62" y="338" width="70" height="18" rx="9" fill="#B45309"/>
    <text x="70" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FEF3C7">FLAM: 4.1 / 5</text>
  </g>

  <!-- ZONE 6: Exit A South Atrium (x:230, y:280, w:170, h:120) -->
  <g id="zone_bldg_b_exit_a">
    <rect x="230" y="280" width="170" height="120" fill="url(#exitGradB)" stroke="#10B981" stroke-width="3" rx="4" filter="url(#exitGlowB)"/>
    <text x="250" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#A7F3D0">EXIT A (SOUTH ATRIUM)</text>
    <text x="250" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6EE7B7">Wide Concourse Stairwell</text>
    <text x="250" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Capacity: 200 Occupants</text>
    <rect x="250" y="365" width="80" height="20" rx="4" fill="#047857"/>
    <text x="262" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ECFDF5">SAFE EXIT</text>
  </g>

  <!-- ZONE 7: Exit B North Concourse (x:420, y:280, w:170, h:120) -->
  <g id="zone_bldg_b_exit_b">
    <rect x="420" y="280" width="170" height="120" fill="url(#exitGradB)" stroke="#10B981" stroke-width="3" rx="4" filter="url(#exitGlowB)"/>
    <text x="440" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#A7F3D0">EXIT B (NORTH CONCOURSE)</text>
    <text x="440" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6EE7B7">Exterior Plaza Exit Gate</text>
    <text x="440" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Capacity: 200 Occupants</text>
    <rect x="440" y="365" width="80" height="20" rx="4" fill="#047857"/>
    <text x="452" y="379" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ECFDF5">SAFE EXIT</text>
  </g>

  <!-- Door Connectors -->
  <rect x="120" y="160" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="300" y="160" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="500" y="160" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="120" y="260" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="300" y="260" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
  <rect x="500" y="260" width="20" height="20" fill="#475569" stroke="#94A3B8" stroke-width="1"/>

  <!-- Legend Bar -->
  <g transform="translate(50, 435)">
    <rect x="0" y="0" width="12" height="12" fill="#EA580C" rx="2"/>
    <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Server Rack / Compute</text>

    <rect x="170" y="0" width="12" height="12" fill="#6366F1" rx="2"/>
    <text x="188" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Classroom / High Density</text>

    <rect x="340" y="0" width="12" height="12" fill="#D97706" rx="2"/>
    <text x="358" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Archive / Facilities</text>

    <rect x="490" y="0" width="12" height="12" fill="#10B981" rx="2"/>
    <text x="508" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">Safe Egress Atrium</text>
  </g>
</svg>
