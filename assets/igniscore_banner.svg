<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <!-- Text Glow -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="bannerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="380" fill="url(#bannerBg)" rx="16"/>
  <rect width="1200" height="380" fill="url(#techGrid)" rx="16"/>

  <!-- Top Accent Glowing Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#titleGrad)"/>

  <!-- Left Side: Mini Brand Emblem (Center X: 140, Y: 190) -->
  <g transform="translate(40, 75) scale(0.48)">
    <circle cx="250" cy="250" r="230" fill="#111827" stroke="#334155" stroke-width="6"/>
    <!-- Shield -->
    <path d="M 250 80 C 340 80, 390 110, 390 190 C 390 310, 290 380, 250 410 C 210 380, 110 310, 110 190 C 110 110, 160 80, 250 80 Z" 
          fill="#1E293B" stroke="url(#titleGrad)" stroke-width="10"/>
    <!-- Flame -->
    <path d="M 250 360 C 210 340, 170 300, 170 240 C 170 190, 200 160, 220 140 C 225 170, 240 185, 255 175 C 270 165, 275 145, 270 120 C 305 155, 330 200, 330 250 C 330 300, 295 340, 250 360 Z"
          fill="url(#bannerFlame)" filter="url(#softGlow)"/>
    <ellipse cx="250" cy="275" rx="16" ry="32" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Typography Content (X: 320) -->
  <!-- Category Tag -->
  <rect x="320" y="60" width="260" height="28" rx="14" fill="#1E293B" stroke="#F97316" stroke-width="1.2"/>
  <circle cx="335" cy="74" r="5" fill="#EF4444"/>
  <text x="350" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FDBA74" letter-spacing="1.5">
    EMERGENCY INTELLIGENCE PLATFORM
  </text>

  <!-- Main System Title -->
  <text x="320" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="2">
    IGNISCORE
  </text>
  <text x="640" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94A3B8">
    Intelligent Fire Hazard Monitoring System
  </text>

  <!-- Subtitle -->
  <text x="320" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#CBD5E1">
    Cloud-Native Multi-Zone Fire Hazard Intelligence, Graph Risk Propagation &amp; Dynamic Evacuation Router
  </text>

  <!-- Feature Pills -->
  <g transform="translate(320, 240)">
    <!-- Pill 1: Dual ML -->
    <rect x="0" y="0" width="195" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E0F2FE">
      ⚡ Dual-Domain ML (99.98%)
    </text>

    <!-- Pill 2: Dijkstra -->
    <rect x="210" y="0" width="200" height="36" rx="18" fill="#1E293B" stroke="#34D399" stroke-width="1.2"/>
    <text x="226" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D1FAE5">
      🧭 Dynamic Dijkstra Egress
    </text>

    <!-- Pill 3: Graph Cascade -->
    <rect x="425" y="0" width="185" height="36" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="441" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FEF3C7">
      🌐 Graph Hazard Cascade
    </text>

    <!-- Pill 4: Local-First -->
    <rect x="625" y="0" width="190" height="36" rx="18" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="641" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#EDE9FE">
      🛡️ 100% Local-First Autonomy
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <line x1="320" y1="315" x2="1140" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="320" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">
    Architecture: React 19 + Express + FastAPI + MongoDB/In-Memory • AWS IoT Core &amp; Lambda Ready
  </text>
  <text x="1040" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F97316">
    v1.0.0 Production
  </text>
</svg>
